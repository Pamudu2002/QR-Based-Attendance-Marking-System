<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lumora/components/bundle.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<header style="{{root}}">
  <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink-muted)">
    <a href="Main.dc.html" style="color: var(--ink-muted); text-decoration: none">Home</a>
    <svg class="lu-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M9 18l6-6-6-6"></path></svg>
    <span style="color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{crumb}}</span>
  </nav>
  <div style="display: flex; align-items: center; gap: 4px">
    <label style="position: relative; display: flex; align-items: center; margin-right: 8px">
      <svg class="lu-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 10px; color: var(--ink-muted)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input class="lu-input" type="search" aria-label="Search students and modules" placeholder="Search students and modules" style="padding-left: 32px; padding-right: 64px; width: 280px">
      <span class="lu-kbd" style="position: absolute; right: 8px">Ctrl+K</span>
    </label>
    <button type="button" class="lu-iconbtn" aria-label="Switch light or dark theme" title="Switch theme" onClick="{{toggle}}">
      <sc-if value="{{light}}" hint-placeholder-val="{{true}}"><svg class="lu-icon lu-icon--md" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
      <sc-if value="{{dark}}" hint-placeholder-val="{{false}}"><svg class="lu-icon lu-icon--md" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
    </button>
    <button type="button" class="lu-iconbtn" aria-label="Notifications, 2 new" title="Notifications"><svg class="lu-icon lu-icon--md" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger)"></span></button>
    <button type="button" class="lu-iconbtn" aria-label="Help" title="Help"><svg class="lu-icon lu-icon--md" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"></path></svg></button>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"crumb":{"editor":"text","default":"Dashboard"},"dark":{"editor":"boolean","default":false},"toggle":{"editor":null},"$preview":{"width":1192,"height":44}}'>
class Component extends DCLogic {
  lu(dark) {
    var T = {'surface':['#ffffff','#161b1c'],'surface-sunken':['#f4f5f2','#121718'],'line':['#e0e3de','#2a3233'],'line-strong':['#868e89','#66726f'],'ink':['#141b1c','#e7eceb'],'ink-muted':['#545f61','#9eaaab'],'brand':['#0d6767','#5cc4bd'],'selected':['#e3f1ef','#163331'],'focus':['#0d6767','#6fd0c9'],'danger':['#b42318','#f8806f']};
    var F = {'font-ui':'"Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif','font-mono':'"Cascadia Mono", ui-monospace, "SF Mono", Consolas, monospace','space-1':'4px','space-2':'8px','space-3':'12px','radius-sm':'4px','radius-md':'6px','control-h':'32px','control-h-sm':'28px','icon-sm':'16px','icon-md':'18px'};
    var o = {};
    for (var k in T) o['--' + k] = T[k][dark ? 1 : 0];
    for (var j in F) o['--' + j] = F[j];
    return o;
  }
  renderVals() {
    var s = this.state || {};
    var dark = this.props.toggle ? !!this.props.dark : (s.dark != null ? s.dark : !!this.props.dark);
    var root = Object.assign(this.lu(dark), { height: '44px', boxSizing: 'border-box', padding: '0 24px 0 32px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '16px', background: 'var(--surface)', borderBottom: '1px solid var(--line)', color: 'var(--ink)', fontFamily: 'var(--font-ui)', fontSize: '13px', lineHeight: '20px' });
    var self = this;
    var toggle = this.props.toggle || function () { self.setState({ dark: !dark }); };
    return { root: root, crumb: this.props.crumb || 'Dashboard', dark: dark, light: !dark, toggle: toggle };
  }
}
</script>
</body>
</html>
